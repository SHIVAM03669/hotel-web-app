<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="m-0">Hotel Booking System</h2>
    @if (auth.isAuthenticated()) {
      <div class="d-flex gap-2">
        <a routerLink="/hotels" class="btn btn-outline-primary btn-sm">Hotels</a>
        <a routerLink="/bookings" class="btn btn-outline-secondary btn-sm">My Bookings</a>
        @if (auth.isAdmin()) {
          <a routerLink="/admin" class="btn btn-outline-dark btn-sm">Admin</a>
        }
        <button class="btn btn-danger btn-sm" (click)="logout()">Logout</button>
      </div>
    }
  </div>
  <router-outlet />
</div>
